<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Leaf to Emerald Green -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="40%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#14532D"/>
    </linearGradient>

    <!-- Glass Cup Body Gradient -->
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#F0FDF4" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#DCFCE7" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Tea Liquid Gradient: Fresh Green Tea Tone -->
    <linearGradient id="teaLiquidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="50%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>

    <!-- Leaf 1 Gradient (Bright Fresh) -->
    <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86EFAC"/>
      <stop offset="50%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>

    <!-- Leaf 2 Gradient (Deep Leaf) -->
    <linearGradient id="leafGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#14532D"/>
    </linearGradient>

    <!-- Ice Cube Highlight -->
    <linearGradient id="iceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#052e16" flood-opacity="0.35"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base with Deep Green Gradient -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Subtle Inner White Gloss Ring for Premium Feel -->
  <rect x="12" y="12" width="488" height="488" rx="118" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.25"/>

  <!-- Ambient Light Reflection on Top Left -->
  <path d="M 40 160 C 40 94 94 40 160 40 L 260 40 C 130 50 50 130 40 260 Z" fill="#FFFFFF" fill-opacity="0.12"/>

  <!-- Main Illustration Group with Drop Shadow -->
  <g filter="url(#softShadow)">
    <!-- Straw -->
    <path d="M 310 100 L 260 210" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round"/>
    <path d="M 310 100 L 350 70" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round"/>
    <!-- Straw Inner Stripe -->
    <path d="M 306 102 L 262 200" stroke="#22C55E" stroke-width="6" stroke-linecap="round"/>
    <path d="M 306 102 L 344 74" stroke="#22C55E" stroke-width="6" stroke-linecap="round"/>

    <!-- Cup Outer Silhouette (Glass Cup) -->
    <path d="M 160 190 L 180 400 C 182 422 202 438 224 438 L 288 438 C 310 438 330 422 332 400 L 352 190 Z" 
          fill="url(#cupGrad)"/>

    <!-- Tea Liquid Inside Cup -->
    <path d="M 168 230 L 184 394 C 186 410 200 422 216 422 L 296 422 C 312 422 326 410 328 394 L 344 230 C 314 242 284 220 256 230 C 228 240 198 220 168 230 Z" 
          fill="url(#teaLiquidGrad)"/>

    <!-- Ice Cube 1 (Left) -->
    <rect x="200" y="255" width="46" height="46" rx="10" fill="url(#iceGrad)" transform="rotate(-12 200 255)"/>
    <rect x="203" y="258" width="40" height="40" rx="8" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.8" transform="rotate(-12 200 255)"/>

    <!-- Ice Cube 2 (Right) -->
    <rect x="264" y="275" width="44" height="44" rx="10" fill="url(#iceGrad)" transform="rotate(18 264 275)"/>
    <rect x="267" y="278" width="38" height="38" rx="8" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.8" transform="rotate(18 264 275)"/>

    <!-- Cup Rim (White Glossy Lip) -->
    <ellipse cx="256" cy="190" rx="96" ry="16" fill="#FFFFFF" fill-opacity="0.95"/>
    <ellipse cx="256" cy="190" rx="88" ry="12" fill="#F0FDF4" fill-opacity="0.9"/>

    <!-- Cup Vertical Gloss Reflection (Left Edge) -->
    <path d="M 178 215 L 194 390 C 195 398 200 402 208 402 L 204 402 C 196 402 191 398 190 390 L 174 215 Z" fill="#FFFFFF" fill-opacity="0.6"/>

    <!-- Fresh Tea Leaves (Topping/Emblem) -->
    <!-- Leaf 1 (Large, curving right) -->
    <path d="M 256 185 C 280 110 360 110 380 140 C 370 200 300 215 256 185 Z" 
          fill="url(#leafGrad1)" stroke="#FFFFFF" stroke-width="4"/>
    <!-- Leaf 1 Center Vein -->
    <path d="M 256 185 C 310 160 350 145 378 141" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.9"/>

    <!-- Leaf 2 (Smaller, curving left) -->
    <path d="M 256 185 C 220 125 155 140 145 170 C 160 215 225 210 256 185 Z" 
          fill="url(#leafGrad2)" stroke="#FFFFFF" stroke-width="4"/>
    <!-- Leaf 2 Center Vein -->
    <path d="M 256 185 C 205 168 170 160 148 168" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8"/>
  </g>

  <!-- Istimewa Stars / Sparkles (White & Mint Crisp Sparkles) -->
  <!-- Big Sparkle Top Right -->
  <path d="M 390 90 Q 390 115 415 115 Q 390 115 390 140 Q 390 115 365 115 Q 390 115 390 90 Z" 
        fill="#FFFFFF" filter="url(#glow)"/>
  <circle cx="390" cy="115" r="4" fill="#BBF7D0"/>

  <!-- Small Sparkle Left -->
  <path d="M 125 240 Q 125 255 140 255 Q 125 255 125 270 Q 125 255 110 255 Q 125 255 125 240 Z" 
        fill="#FFFFFF" opacity="0.9"/>

  <!-- Micro Sparkle Bottom Right -->
  <circle cx="360" cy="380" r="5" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="150" cy="360" r="3.5" fill="#FFFFFF" opacity="0.7"/>

  <!-- Brand Typography Arc / Pill Banner at Bottom: "ISTIMEWA" -->
  <g transform="translate(0, 442)">
    <rect x="156" y="0" width="200" height="34" rx="17" fill="#FFFFFF" filter="url(#softShadow)"/>
    <text x="256" y="23" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="14" fill="#14532D" letter-spacing="4">
      ISTIMEWA
    </text>
  </g>
</svg>
